<section id="reviews" class="section testimonials" aria-labelledby="reviews-title">
  <div class="container">
    <div class="section-head">
      <div class="section-head__copy" appReveal>
        <span class="eyebrow">Patient stories</span>
        <h2 id="reviews-title" class="section-title">Kind words from <em>our people.</em></h2>
      </div>
      <div class="testimonials__rating" appReveal [revealDelay]="90">
        <span class="testimonials__rating-score">{{ clinic.rating }}</span>
        <div>
          <span class="stars" aria-hidden="true">
            @for (star of stars; track star) {
              <app-icon name="star" [size]="14" />
            }
          </span>
          <p>{{ clinic.reviewCount }} Google reviews · {{ clinic.patientCount }} patients</p>
        </div>
      </div>
    </div>

    <div class="testimonials__grid">
      @for (review of testimonials; track review.name; let index = $index) {
        <figure class="review-card" appReveal [revealDelay]="index * 90">
          <app-icon class="review-card__quote" name="quote" [size]="30" />
          <span class="stars" aria-label="5 out of 5 stars">
            @for (star of stars; track star) {
              <app-icon name="star" [size]="13" />
            }
          </span>
          <blockquote>{{ review.quote }}</blockquote>
          <figcaption>
            <span class="review-card__avatar" aria-hidden="true">{{ initials(review.name) }}</span>
            <div>
              <strong>{{ review.name }}</strong>
              <span>{{ review.treatment }}</span>
            </div>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
